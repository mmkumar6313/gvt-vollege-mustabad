<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID Card Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app-root">
  <style>
    #app-root {
      --navy: #0d1c4e;
      --gold: #c9a24b;
      --green: #1a8a4a;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #222;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px;
    }

    #app-root * {
      box-sizing: border-box;
    }

    .layout {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
    }

    .form-panel {
      flex: 1 1 340px;
      max-width: 380px;
      background: #fafafa;
      border: 1px solid #e2e2e2;
      border-radius: 14px;
      padding: 22px 22px 26px;
    }

    .form-panel h2 {
      margin: 0 0 4px;
      font-size: 19px;
      color: var(--navy);
    }

    .form-panel p.sub {
      margin: 0 0 16px;
      font-size: 12.5px;
      color: #777;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 4px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d3d3d3;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }

    .field textarea {
      resize: vertical;
      min-height: 46px;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(13, 28, 78, 0.12);
    }

    .photo-upload-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .photo-upload-box .preview {
      width: 58px;
      height: 58px;
      border-radius: 6px;
      background: #eee;
      border: 2px dashed #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 10px;
      color: #999;
      text-align: center;
      flex-shrink: 0;
    }

    .photo-upload-box .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-upload-box label.btn {
      background: var(--navy);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .photo-upload-box input[type=file] {
      display: none;
    }

    .download-btn {
      width: 100%;
      margin-top: 8px;
      background: var(--gold);
      color: #2b2200;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .download-btn:hover {
      filter: brightness(1.06);
    }

    .download-btn:active {
      filter: brightness(0.95);
    }

    .download-hint {
      text-align: center;
      font-size: 11.5px;
      color: #999;
      margin-top: 6px;
    }

    .status-msg {
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
      min-height: 16px;
    }

    .status-msg.ok {
      color: var(--green);
    }

    .status-msg.err {
      color: #c0392b;
    }

    .card-wrapper {
      flex: 0 0 auto;
    }

    #cardCanvas {
      width: 340px;
      height: 538px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      display: block;
      background: #fff;
    }

    .loading-note {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 6px;
    }
  </style>

  <div class="layout">
    <div class="form-panel">
      <h2>Student ID Card Form</h2>
      <p class="sub">Fill cheyandi — card automatic ga update avutundi.</p>

      <div class="photo-upload-box">
        <div class="preview" id="photoPreview">Photo</div>
        <label class="btn">Photo Upload
          <input type="file" id="photoInput" accept="image/*">
        </label>
      </div>

      <div class="field"><label>Student Name</label>
        <input type="text" id="f_name" placeholder="Student Name">
      </div>
      <div class="field"><label>Adm. No</label>
        <input type="text" id="f_adm" placeholder="e.g. 1024">
      </div>
      <div class="field"><label>DOB</label>
        <input type="text" id="f_dob" placeholder="e.g. 12-05-2012">
      </div>
      <div class="field"><label>Group</label>
        <input type="text" id="f_group" placeholder="Group">
      </div>
      <div class="field"><label>Parent Name</label>
        <input type="text" id="f_father" placeholder="Parent Name">
      </div>
      <div class="field"><label>Phone No</label>
        <input type="text" id="f_phone" placeholder="e.g. 9876543210">
      </div>
      <div class="field"><label>Address</label>
        <textarea id="f_address" placeholder="Address"></textarea>
      </div>

      <button class="download-btn" id="downloadBtn">⬇ Download ID Card</button>
<!-- <button class="download-btn" id="downloadPdfBtn">⬇ Download PDF</button> -->
      <p class="status-msg" id="statusMsg"></p>
    </div>

    <div class="card-wrapper">
      <canvas id="cardCanvas"></canvas>
      <p class="loading-note" id="loadingNote">Loading template...</p>
    </div>
  </div>

  <script src="card.js"></script>
</div>
</body>
</html>
